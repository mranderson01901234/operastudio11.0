version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: operastudio-db
    environment:
      POSTGRES_USER: operastudio
      POSTGRES_PASSWORD: operastudio_dev_password
      POSTGRES_DB: operastudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operastudio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

